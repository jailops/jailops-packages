# Extra prune entries: published package files an administrator wants out of the site beyond the retention policy
# (for example `pkgops prune --plan --name N --version V --force`). Normally empty: the publish job prunes by itself, in every
# run, so that only the newest two versions of every package and ABI stay on the site (docs/RETENTION.md). It adds its entries to
# this file in the job and applies the result; nothing is committed. Nothing is deleted from the archive (GitHub Releases).
schema: 1
entries: []
