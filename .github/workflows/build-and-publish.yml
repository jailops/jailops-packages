name: Build and publish

# FreeBSD 15.1+ packages for amd64 and aarch64, built with PkgOps (the only packaging tool here), published as a signed
# pkg repository to GitHub Pages at https://pkg.jailops.net/${ABI}/latest. UNVERIFIED: this workflow has not run on GitHub.
#
#   pull request / other branch: check, baseline, validate the app catalog, build, assemble an UNSIGNED repository in a
#                                temp dir and verify it.
#                                No secret except the optional source token, no signing, no publishing.
#   push to master:              the same, then the `publish` job (environment `signing`) signs and archives, and
#                                the `deploy` job deploys the site with actions/deploy-pages.
#
# The site is an artifact rebuilt every run: baseline (pkgops fetch from the live site, or the Releases archive) plus
# the packages built now. The package files of the baseline come from the Actions cache when they match the live index
# (scripts/baseline.sh); the cache only saves downloads and never decides what is published. Nothing is deleted automatically: a version leaves the site only through prune.yaml.
# The baseline is verified against the signing key (KEY_FINGERPRINT) before anything is fetched, and in the publish job
# everything that is downloaded, restored or verified happens before the key is written; the key exists only during
# the signing step and is removed right after it (docs/supply-chain.md).
#
# One-time setup this file cannot do: see "Maintainers" in README.md and docs/supply-chain.md (GitHub settings).

on:
  push:
    branches: [master]
    paths:
      - "main/**"
      - "scripts/**"
      - "static/**"
      - "pkgops-repo.yaml"
      - "prune.yaml"
      - "KEY_FINGERPRINT"
      - "PKGOPS_VERSION"
      - ".github/workflows/build-and-publish.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "main/**"
      - "scripts/**"
      - "pkgops-repo.yaml"
      - "prune.yaml"
      - "PKGOPS_VERSION"
      - ".github/workflows/build-and-publish.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      first_run:
        description: "Very first publish: there is no site and no archive to fetch a baseline from"
        type: boolean
        default: false

env:
  GOTOOLCHAIN: auto
  SITE_URL: https://pkg.jailops.net
  # Third-party actions must be pinned to a commit SHA (scripts/check-actions-pinned.sh). There are none today, so this
  # enforces; "0" would only warn.
  ACTIONS_PIN_ENFORCE: "1"

# Nothing by default: every job names what it needs.
permissions: {}

# Every publish rebuilds the whole site from the live one: two overlapping runs would revert each other.
concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'publish' || format('build-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pkgs: ${{ steps.changed.outputs.pkgs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: No binaries in git
        run: sh scripts/no-binaries.sh
      - name: Third-party actions pinned to a commit SHA
        run: sh scripts/check-actions-pinned.sh
      - name: Check the repository (manifests, policy, GOTOOLCHAIN, no keys, immutability)
        env:
          CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/check-pkgops.sh

      - uses: ./.github/actions/setup-pkgops

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore the baseline cache (an optimisation of the package files only; the live index decides)
        if: ${{ !inputs.first_run }}
        uses: actions/cache/restore@v4
        with:
          path: .baseline-cache
          key: baseline-${{ hashFiles('PKGOPS_VERSION') }}-${{ github.run_id }}
          restore-keys: |
            baseline-${{ hashFiles('PKGOPS_VERSION') }}-

      - name: Baseline (what is published now; verified against KEY_FINGERPRINT)
        env:
          BASELINE_FIRST_RUN: ${{ inputs.first_run && '1' || '' }}
          # this job signs nothing: an older pinned pkgops without `fetch --pubkey` only warns here
          BASELINE_UNVERIFIED_OK: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/baseline.sh site "$SITE_URL"

      - name: Which packages need building
        id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          pkgs=$(sh scripts/changed.sh "$BASE" HEAD site)
          echo "packages to build: ${pkgs:-none}"
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"

      # The catalog's definitions are checked with the daemon's own validator before jailops-apps is built, and when
      # jailops is built (a new daemon must still accept them). The client is built from the jailops source this repository
      # packages. Until that release has `jailops app validate`, the step prints a loud NOT VALIDATED warning and goes on;
      # from then on it enforces itself (scripts/validate-apps.sh).
      - name: Validate the app catalog (jailops app validate)
        if: contains(format(' {0} ', steps.changed.outputs.pkgs), ' jailops-apps ') || contains(format(' {0} ', steps.changed.outputs.pkgs), ' jailops ')
        env:
          JAILOPS_SOURCE_TOKEN: ${{ secrets.JAILOPS_SOURCE_TOKEN }}
        run: sh scripts/validate-apps.sh

      - name: Build
        if: steps.changed.outputs.pkgs != ''
        env:
          PKGS: ${{ steps.changed.outputs.pkgs }}
          # the secret named by token_env in main/*/upstream.yaml; empty on fork pull requests (the package is then skipped)
          JAILOPS_SOURCE_TOKEN: ${{ secrets.JAILOPS_SOURCE_TOKEN }}
        run: sh scripts/build-pkg.sh $PKGS

      - name: Assemble an unsigned repository and verify it (policy, prune.yaml, catalogs)
        run: |
          set -eu
          mkdir -p dist
          # Nothing was built (a push that touches no package): there is nothing to assemble, and the baseline site holds the
          # packages and the index but not the catalogs, which only `pkgops repo` writes. The publish job signs the site
          # again and verifies it, so only a real assembly is verified here.
          if [ -n "$(find dist -name '*.pkg' -print -quit)" ]; then
            pkgops repo --repo site --policy pkgops-repo.yaml --prune prune.yaml dist
            for abi in FreeBSD:15:amd64 FreeBSD:15:aarch64; do pkgops verify "site/$abi/latest"; done
            sh scripts/verify-site.sh site
            python3 scripts/versions-index.py site   # the index for web pages, from these (unsigned) catalogs: tested here
          else
            echo "no package was built: nothing to assemble here"
          fi

      # upload-artifact refuses file names with a colon (FreeBSD:15:amd64), so the built packages travel as ONE tar file.
      - name: "Pack the built packages for the publish job (one tar file, since artifacts reject a colon in paths)"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          set -eu
          mkdir -p dist
          tar -cf "$RUNNER_TEMP/dist.tar" dist
          ls -l "$RUNNER_TEMP/dist.tar"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          name: dist
          path: ${{ runner.temp }}/dist.tar
          compression-level: 0   # .pkg files are already compressed
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    # The signing key lives only in this Environment (a repository secret can be overwritten by anyone with write
    # access; an environment secret needs admin). The job never runs for a pull request or a branch other than master.
    # Its protection rules (required reviewers, deployment branches: master only) are GitHub settings, not YAML:
    # docs/supply-chain.md says which to confirm.
    environment: signing
    permissions:
      contents: write   # the archive: one GitHub release per package version
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pkgops

      # Everything that is downloaded, restored or verified comes first; the key is not on disk yet.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ runner.temp }}/dist-artifact

      - name: Unpack the built packages
        run: |
          set -eu
          tar -xf "$RUNNER_TEMP/dist-artifact/dist.tar"
          mkdir -p dist
          echo "built packages: $(find dist -name '*.pkg' | wc -l)"

      - name: Restore the baseline cache (an optimisation of the package files only; the live index decides)
        if: ${{ !inputs.first_run }}
        uses: actions/cache/restore@v4
        with:
          path: .baseline-cache
          key: baseline-${{ hashFiles('PKGOPS_VERSION') }}-${{ github.run_id }}
          restore-keys: |
            baseline-${{ hashFiles('PKGOPS_VERSION') }}-

      - name: Baseline again (the freshest published state; verified against KEY_FINGERPRINT, required here)
        env:
          BASELINE_FIRST_RUN: ${{ inputs.first_run && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/baseline.sh site "$SITE_URL"

      # The archive is a second, independent copy of every published version: a changed older version (no signature
      # covers it) or a version that was published and is now missing (an older site served again) stops the run here.
      - name: Cross-check the baseline with the archive (before the key exists)
        if: ${{ !inputs.first_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pkgops verify-archive --repo "$GITHUB_REPOSITORY" --from site --prune prune.yaml

      # The only step with the key on disk: written with umask 077, used for the site files and the signature, removed
      # when the step ends (trap) and again by the next step, whatever happened.
      - name: Sign (site files derived from the key, then the catalogs)
        env:
          PKG_REPO_KEY: ${{ secrets.PKG_REPO_KEY }}
        run: |
          set -eu
          if [ -z "$PKG_REPO_KEY" ]; then
            echo "::error title=PKG_REPO_KEY is not set::Create the Environment 'signing' with the secret PKG_REPO_KEY (README, Maintainers) before the first publish. Nothing was published."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/pkg-repo.key"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          printf '%s\n' "$PKG_REPO_KEY" > "$key"
          unset PKG_REPO_KEY
          sh scripts/site-files.sh site "$key"
          mkdir -p dist
          if [ -n "$(find dist -name '*.pkg' -print -quit)" ]; then set -- dist; else set --; fi
          pkgops repo --repo site --policy pkgops-repo.yaml --prune prune.yaml --key "$key" "$@"

      - name: Remove the signing key
        if: always()
        run: |
          key="$RUNNER_TEMP/pkg-repo.key"
          if [ -e "$key" ]; then shred -u "$key" 2>/dev/null || rm -f "$key"; fi
          [ ! -e "$key" ]

      - name: Verify the signed repository
        run: |
          set -eu
          for abi in FreeBSD:15:amd64 FreeBSD:15:aarch64; do pkgops verify "site/$abi/latest" --pubkey site/jailops.pub; done
          sh scripts/verify-site.sh site

      # versions.json: the newest version of every package, read from the catalogs verified just above, for web pages
      # (jailops.net shows the published versions from it). Informational and NOT signed: pkg never reads it, and no
      # script decides anything from it (baseline, changed, verify-site use pkgops-index.json and the signed catalogs).
      - name: Versions index for web pages (versions.json; informational, not signed)
        run: python3 scripts/versions-index.py site

      - name: Archive every published package in GitHub Releases (idempotent; before the deploy, from the same bytes)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pkgops archive push --repo "$GITHUB_REPOSITORY" --from site

      - name: Cache the published package files for the next run (.baseline-cache only; never the key or the site)
        run: sh scripts/baseline.sh --refresh-cache site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Only here: after the signed repository verified and was handed to the Pages upload; never in a pull request.
      - name: Save the baseline cache
        if: ${{ !inputs.first_run && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: .baseline-cache
          key: baseline-${{ hashFiles('PKGOPS_VERSION') }}-${{ github.run_id }}

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
