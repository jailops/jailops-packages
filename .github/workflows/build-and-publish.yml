name: Build and publish

# FreeBSD 15.1+ packages for amd64 and aarch64, built with PkgOps (the only packaging tool here), published as a signed
# pkg repository to GitHub Pages at https://pkg.jailops.net/${ABI}/latest. UNVERIFIED: this workflow has not run on GitHub.
#
#   pull request / other branch: check, baseline, validate the app catalog, build, assemble an UNSIGNED repository in a
#                                temp dir and verify it. Public inputs only: no secret, no signing, no publishing.
#                                A package whose source needs a token is built on master only.
#   push to master:              the same, strict (a package that cannot be built stops the run), then `build-private`
#                                (environment `source`, the only job with the source token, only for packages whose
#                                upstream.yaml names a token_env), then the `publish` job (environment `signing`) checks the
#                                build records and that every package of main/ is in the repository, signs and archives,
#                                and the `deploy` job deploys the site with actions/deploy-pages.
#
# The site is an artifact rebuilt every run: baseline (pkgops fetch from the live site, or the Releases archive) plus
# the packages built now. The package files of the baseline come from the Actions cache when they match the live index
# (scripts/baseline.sh); the cache only saves downloads and never decides what is published. Nothing is deleted automatically: a version leaves the site only through prune.yaml.
# The baseline is verified against the signing key (KEY_FINGERPRINT) before anything is fetched, and in the publish job
# everything that is downloaded, restored or verified happens before the key is written; the key exists only during
# the signing step and is removed right after it (docs/supply-chain.md).
#
# One-time setup this file cannot do: see "Maintainers" in README.md and docs/supply-chain.md (GitHub settings).

on:
  push:
    branches: [master]
    paths:
      - "main/**"
      - "scripts/**"
      - "static/**"
      - "pkgops-repo.yaml"
      - "prune.yaml"
      - "KEY_FINGERPRINT"
      - "PKGOPS_VERSION"
      - ".github/workflows/build-and-publish.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "main/**"
      - "scripts/**"
      - "pkgops-repo.yaml"
      - "prune.yaml"
      - "PKGOPS_VERSION"
      - ".github/workflows/build-and-publish.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      first_run:
        description: "Very first publish: there is no site and no archive to fetch a baseline from"
        type: boolean
        default: false
      deploy_run_id:
        description: "Recovery only: the id of an earlier successful publish run of master; deploys the signed site of that run and does nothing else (docs/supply-chain.md)"
        type: string
        default: ""

env:
  GOTOOLCHAIN: auto
  SITE_URL: https://pkg.jailops.net
  # Every action is pinned to a commit SHA (scripts/check-actions-pinned.sh); "0" would only warn.
  ACTIONS_PIN_ENFORCE: "1"

# Nothing by default: every job names what it needs.
permissions: {}

# Every publish rebuilds the whole site from the live one: two overlapping runs would revert each other.
concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'publish' || format('build-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.deploy_run_id == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pkgs: ${{ steps.changed.outputs.pkgs }}
      private: ${{ steps.changed.outputs.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: No binaries in git
        run: sh scripts/no-binaries.sh
      - name: Third-party actions pinned to a commit SHA
        run: sh scripts/check-actions-pinned.sh
      - name: Check the repository (manifests, policy, GOTOOLCHAIN, no keys, immutability)
        env:
          CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/check-pkgops.sh

      - uses: ./.github/actions/setup-pkgops

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 24

      - name: Restore the baseline cache (an optimisation of the package files only; the live index decides)
        if: ${{ !inputs.first_run }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: .baseline-cache
          key: baseline-${{ hashFiles('PKGOPS_VERSION') }}-${{ github.run_id }}
          restore-keys: |
            baseline-${{ hashFiles('PKGOPS_VERSION') }}-

      - name: Baseline (what is published now; verified against KEY_FINGERPRINT)
        env:
          BASELINE_FIRST_RUN: ${{ inputs.first_run && '1' || '' }}
          # this job signs nothing: an older pinned pkgops without `fetch --pubkey` only warns here
          BASELINE_UNVERIFIED_OK: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/baseline.sh site "$SITE_URL"

      # The plan is name:abi,abi per package: only the ABIs the published index lacks are built, so a published file of
      # the other ABI is never rebuilt (another toolchain today would give other bytes, and a published file is immutable).
      # A package whose upstream.yaml names a token_env is not built here: this job has no secret.
      - name: Which packages need building
        id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          plan=$(sh scripts/changed.sh --pairs "$BASE" HEAD site)
          public=$(sh scripts/split-plan.sh public $plan)
          private=$(sh scripts/split-plan.sh private $plan)
          echo "packages to build: ${plan:-none}"
          echo "  here (no secret): ${public:-none}"
          echo "  with the source token (master only): ${private:-none}"
          { echo "pkgs=$public"; echo "private=$private"; } >> "$GITHUB_OUTPUT"

      # The catalog's definitions are checked with the daemon's own validator before jailops-apps is built, and when
      # jailops is built (a new daemon must still accept them). The client is built from the jailops source this repository
      # packages. Until that release has `jailops app validate`, the step prints a loud NOT VALIDATED warning and goes on;
      # from then on it enforces itself (scripts/validate-apps.sh).
      - name: Validate the app catalog (jailops app validate)
        if: contains(steps.changed.outputs.pkgs, 'jailops-apps') || contains(steps.changed.outputs.pkgs, 'jailops:')
        run: sh scripts/validate-apps.sh

      - name: Build
        if: steps.changed.outputs.pkgs != ''
        env:
          PKGS: ${{ steps.changed.outputs.pkgs }}
          # on master a package that cannot be built stops the run (no silent skip); a pull request builds what it can
          BUILD_STRICT: ${{ github.event_name != 'pull_request' && '1' || '' }}
          BUILD_LABEL: build
        run: sh scripts/build-pkg.sh $PKGS
      - name: Packages that need the source token are built on master only
        if: github.event_name == 'pull_request' && steps.changed.outputs.private != ''
        env:
          PRIVATE: ${{ steps.changed.outputs.private }}
        run: echo "::notice::not built in a pull request, the source needs a token (master builds it) - $PRIVATE"

      - name: Assemble an unsigned repository and verify it (policy, prune.yaml, catalogs)
        run: |
          set -eu
          mkdir -p dist
          # Nothing was built (a push that touches no package): there is nothing to assemble, and the baseline site holds the
          # packages and the index but not the catalogs, which only `pkgops repo` writes. The publish job signs the site
          # again and verifies it, so only a real assembly is verified here.
          if [ -n "$(find dist -name '*.pkg' -print -quit)" ]; then
            pkgops repo --repo site --policy pkgops-repo.yaml --prune prune.yaml dist
            for abi in FreeBSD:15:amd64 FreeBSD:15:aarch64; do pkgops verify "site/$abi/latest"; done
            sh scripts/verify-site.sh site
            python3 scripts/versions-index.py site   # the index for web pages, from these (unsigned) catalogs: tested here
          else
            echo "no package was built: nothing to assemble here"
          fi

      # upload-artifact refuses file names with a colon (FreeBSD:15:amd64), so the built packages travel as ONE tar file.
      - name: "Pack the built packages for the publish job (one tar file, since artifacts reject a colon in paths)"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          set -eu
          mkdir -p dist
          tar -cf "$RUNNER_TEMP/dist.tar" dist
          ls -l "$RUNNER_TEMP/dist.tar"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          name: dist
          path: ${{ runner.temp }}/dist.tar
          compression-level: 0   # .pkg files are already compressed
          if-no-files-found: error

  # The packages whose source needs a token (token_env in upstream.yaml). The only job with JAILOPS_SOURCE_TOKEN, and it
  # runs for master only: the secret lives in the Environment `source` (deployment branches: master only, a GitHub
  # setting: docs/supply-chain.md), never in a job a pull request can change. The token is used to download the source
  # and for nothing else: prebuild and `pkgops build` run without it (scripts/build-pkg.sh).
  build-private:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.build.outputs.private != ''
    runs-on: ubuntu-24.04
    environment: source
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pkgops

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 24

      - name: Build
        env:
          PKGS: ${{ needs.build.outputs.private }}
          JAILOPS_SOURCE_TOKEN: ${{ secrets.JAILOPS_SOURCE_TOKEN }}
          BUILD_STRICT: "1"
          BUILD_LABEL: private
        run: sh scripts/build-pkg.sh $PKGS

      - name: Pack the built packages for the publish job
        run: |
          set -eu
          tar -cf "$RUNNER_TEMP/dist-private.tar" dist
          ls -l "$RUNNER_TEMP/dist-private.tar"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: dist-private
          path: ${{ runner.temp }}/dist-private.tar
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [build, build-private]
    # build-private is skipped when no package needs the token; a failed one stops the publish
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.build.result == 'success' && (needs.build-private.result == 'success' || needs.build-private.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # The signing key lives only in this Environment (a repository secret can be overwritten by anyone with write
    # access; an environment secret needs admin). The job never runs for a pull request or a branch other than master.
    # Its protection rules (required reviewers, deployment branches: master only) are GitHub settings, not YAML:
    # docs/supply-chain.md says which to confirm.
    environment: signing
    permissions:
      contents: write   # the archive: one GitHub release per package version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pkgops

      # Everything that is downloaded, restored or verified comes first; the key is not on disk yet.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist-artifact

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        if: needs.build-private.result == 'success'
        with:
          name: dist-private
          path: ${{ runner.temp }}/dist-private-artifact

      - name: Unpack the built packages
        run: |
          set -eu
          tar -xf "$RUNNER_TEMP/dist-artifact/dist.tar"
          if [ -f "$RUNNER_TEMP/dist-private-artifact/dist-private.tar" ]; then tar -xf "$RUNNER_TEMP/dist-private-artifact/dist-private.tar"; fi
          mkdir -p dist
          echo "built packages: $(find dist -name '*.pkg' | wc -l)"

      # The packages in dist are those the build jobs made: every file is in a build record with the size and sha256 it
      # had when it was built, from this commit, at the version of its manifest.
      - name: Check the packages against the build records
        env:
          EXPECT_COMMIT: ${{ github.sha }}
        run: sh scripts/verify-build-record.sh dist

      - name: Restore the baseline cache (an optimisation of the package files only; the live index decides)
        if: ${{ !inputs.first_run }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: .baseline-cache
          key: baseline-${{ hashFiles('PKGOPS_VERSION') }}-${{ github.run_id }}
          restore-keys: |
            baseline-${{ hashFiles('PKGOPS_VERSION') }}-

      - name: Baseline again (the freshest published state; verified against KEY_FINGERPRINT, required here)
        env:
          BASELINE_FIRST_RUN: ${{ inputs.first_run && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/baseline.sh site "$SITE_URL"

      # The archive is a second, independent copy of every published version: a changed older version (no signature
      # covers it) or a version that was published and is now missing (an older site served again) stops the run here.
      - name: Cross-check the baseline with the archive (before the key exists)
        if: ${{ !inputs.first_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/verify-archive.sh --repo "$GITHUB_REPOSITORY" --from site --prune prune.yaml

      # Before the key: the repository about to be signed (the baseline and what was built now) holds every package of
      # main/ at its current version for every ABI, and a file built now is the file that is already published.
      - name: Every package of main/ is in the repository to sign
        run: sh scripts/expect-packages.sh site dist

      # The only step with the key on disk: written with umask 077, used for the site files and the signature, removed
      # when the step ends (trap) and again by the next step, whatever happened.
      - name: Sign (site files derived from the key, then the catalogs)
        env:
          PKG_REPO_KEY: ${{ secrets.PKG_REPO_KEY }}
        run: |
          set -eu
          if [ -z "$PKG_REPO_KEY" ]; then
            echo "::error title=PKG_REPO_KEY is not set::Create the Environment 'signing' with the secret PKG_REPO_KEY (README, Maintainers) before the first publish. Nothing was published."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/pkg-repo.key"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          printf '%s\n' "$PKG_REPO_KEY" > "$key"
          unset PKG_REPO_KEY
          sh scripts/site-files.sh site "$key"
          mkdir -p dist
          if [ -n "$(find dist -name '*.pkg' -print -quit)" ]; then set -- dist; else set --; fi
          pkgops repo --repo site --policy pkgops-repo.yaml --prune prune.yaml --key "$key" "$@"

      - name: Remove the signing key
        if: always()
        run: |
          key="$RUNNER_TEMP/pkg-repo.key"
          if [ -e "$key" ]; then shred -u "$key" 2>/dev/null || rm -f "$key"; fi
          [ ! -e "$key" ]

      - name: Verify the signed repository
        run: |
          set -eu
          for abi in FreeBSD:15:amd64 FreeBSD:15:aarch64; do pkgops verify "site/$abi/latest" --pubkey site/jailops.pub; done
          VERIFY_SITE_STRICT=1 sh scripts/verify-site.sh site

      # versions.json: the newest version of every package, read from the catalogs verified just above, for web pages
      # (jailops.net shows the published versions from it). Informational and NOT signed: pkg never reads it, and no
      # script decides anything from it (baseline, changed, verify-site use pkgops-index.json and the signed catalogs).
      - name: Versions index for web pages (versions.json; informational, not signed)
        run: python3 scripts/versions-index.py site

      - name: Archive every published package in GitHub Releases (idempotent; before the deploy, from the same bytes)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pkgops archive push --repo "$GITHUB_REPOSITORY" --from site

      - name: Cache the published package files for the next run (.baseline-cache only; never the key or the site)
        run: sh scripts/baseline.sh --refresh-cache site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3.0.1
        with:
          path: site

      # Only here: after the signed repository verified and was handed to the Pages upload; never in a pull request.
      - name: Save the baseline cache
        if: ${{ !inputs.first_run && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: .baseline-cache
          key: baseline-${{ hashFiles('PKGOPS_VERSION') }}-${{ github.run_id }}

  # A job whose `needs` chain holds a skipped job is skipped unless it has a status check function: build-private is
  # skipped when no package has a token_env, so `deploy` says `always()` and asks for the result of publish itself.
  deploy:
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5

  # Recovery: the archive is ahead of Pages (a publish run archived a package and its deploy did not run). Deploys the
  # signed site that an earlier publish run of master already built, verified and archived: no build, no signing, no key.
  redeploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.deploy_run_id != '' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read      # the run, its jobs and its artifact
      contents: read     # the archive (public releases)
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # First, before any file of the repository is used: which run, and the commit it was built from.
      - name: The run is a successful publish run of master
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.deploy_run_id }}
        run: |
          set -eu
          case "$RUN_ID" in ''|*[!0-9]*) echo "::error::deploy_run_id must be a run number"; exit 1 ;; esac
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '[.path, .head_branch, .event, .status] | join(" ")')
          case "$run" in
            ".github/workflows/build-and-publish.yml master push completed"|".github/workflows/build-and-publish.yml master workflow_dispatch completed") ;;
            *) echo "::error::run $RUN_ID is not a completed push or dispatch run of build-and-publish.yml on master ($run)"; exit 1 ;;
          esac
          pub=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "publish") | .conclusion')
          [ "$pub" = success ] || { echo "::error::the job publish of run $RUN_ID did not succeed ($pub)"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          case "$sha" in *[!0-9a-f]*|'') echo "::error::run $RUN_ID has no commit ($sha)"; exit 1 ;; esac
          [ "${#sha}" = 40 ] || { echo "::error::run $RUN_ID has no commit ($sha)"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The manifests, KEY_FINGERPRINT, prune.yaml and the scripts of the verification are those of the commit the site
      # was built from: the artifact is compared with the repository state it was made from, not with current master.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ steps.run.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-pkgops

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: github-pages
          run-id: ${{ inputs.deploy_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pages-artifact

      - name: Unpack and verify the signed site (the key of KEY_FINGERPRINT, the signed catalogs, the archive)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p site
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C site
          want=$(tr -d ' \n\r' < KEY_FINGERPRINT)
          have=$(sha256sum site/jailops.pub | cut -d' ' -f1)
          [ "$have" = "$want" ] || { echo "::error::site/jailops.pub has sha256 $have, KEY_FINGERPRINT says $want"; exit 1; }
          for abi in FreeBSD:15:amd64 FreeBSD:15:aarch64; do pkgops verify "site/$abi/latest" --pubkey site/jailops.pub; done
          VERIFY_SITE_STRICT=1 sh scripts/verify-site.sh site
          sh scripts/verify-archive.sh --repo "$GITHUB_REPOSITORY" --from site --prune prune.yaml

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3.0.1
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
