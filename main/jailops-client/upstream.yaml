# Where the sources of this package come from. Read by scripts/*.sh and .github/workflows/check-updates.yml.
# One "key: value" per line (no nesting): the scripts parse it with sed.
# bump_note (optional, anywhere below): one warning line that check-updates.yml puts in the bump PR ("read this before merging").
group: jailops                       # packages of one group are bumped, built and skipped together
repo: jailops/jailops                # GitHub owner/name
tag_prefix: v                        # tag = tag_prefix + version (without a _N revision)
# ${repo} ${tag} ${version} are replaced. The API tarball also works for a private repository (with the token).
tarball: https://api.github.com/repos/${repo}/tarball/${tag}
strip_components: 1
sha256: cf9d0ebd57774ebf67a163903e94d195575e6d4b892e6a82ab9bcb34a861b326
token_env:      # optional: a secret (also an env var) with read access to a private repo; skipped with a message when it is needed and absent
prebuild:                            # steps of scripts/prebuild.sh, space separated; empty = none
bump_note: jailops runs as root-adjacent daemons and consoles (jailopsd, jailops-priv, jailops-backupd): read the release notes for rc.d, config and API changes before merging.
