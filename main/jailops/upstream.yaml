# See main/jailops-client/upstream.yaml for the meaning of the keys.
group: jailops
repo: jailops/jailops
tag_prefix: v
tarball: https://api.github.com/repos/${repo}/tarball/${tag}
strip_components: 1
sha256: PENDING
token_env: JAILOPS_SOURCE_TOKEN
# the host console is embedded in jailopsd (web/apps.json: host -> internal/webui); the TypeScript types must be in sync
prebuild: jailops-web:host
bump_note: jailops runs as root-adjacent daemons and consoles (jailopsd, jailops-priv, jailops-backupd): read the release notes for rc.d, config and API changes before merging.
