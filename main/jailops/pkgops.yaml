name: jailops
version: 0.6.2
origin: jailops/jailops
comment: JailOps, ZFS-native jail management - daemon and privileged helper
desc: |
  jailopsd, the JailOps daemon (REST API and embedded web console), and
  jailops-priv, the small privileged helper it uses, with their rc.d scripts and
  sample configuration. Needs ZFS. After installing run, as root: jailops-setup
www: https://jailops.net
maintainer: packages@jailops.net
license: BSD2CLAUSE
categories: [sysutils]
abis: [FreeBSD:15:amd64, FreeBSD:15:aarch64]
min_release: "15.1"

deps:
  # same version as the jailops-client package in this repository (scripts/check-pkgops.sh enforces it)
  - {name: jailops-client, origin: jailops/jailops-client, version: "0.6.2"}
  # the application catalog, so jailops app list works right after the install. It has a version of its own: pkg
  # resolves a dependency by name, so ANY jailops-apps version satisfies this line, and its version only records the
  # first one; it is not kept in step (scripts/check-pkgops.sh checks equal versions within a group only)
  - {name: jailops-apps, origin: jailops/jailops-apps, version: "0.4.0"}

build:
  type: go
  dir: src
  packages:
    - {package: ./cmd/jailopsd}
    - {package: ./cmd/jailops-priv}
  ldflags: -s -w -X main.version=${VERSION}

files:
  - source: build/${ARCH}/jailopsd
    destination: sbin/jailopsd
  - source: build/${ARCH}/jailops-priv
    destination: libexec/jailops-priv
  # the one command a user runs after the install (jailops-priv init, forwarding, pf.conf, the services)
  - source: src/packaging/jailops-setup
    destination: sbin/jailops-setup
    mode: 0755
  # samples come from the fetched source tree, so they cannot drift from the code
  - source: src/packaging/jailopsd.yaml
    destination: etc/jailops/jailopsd.yaml.sample
  - source: src/packaging/priv.conf.sample
    destination: etc/jailops/priv.conf.sample
  - source: src/packaging/man/jailopsd.8
    destination: share/man/man8/jailopsd.8
  - source: src/packaging/man/jailops-priv.8
    destination: share/man/man8/jailops-priv.8
  - source: src/packaging/man/jailops-setup.8
    destination: share/man/man8/jailops-setup.8
  - source: src/README.md
    destination: share/doc/jailops/README.md
  - source: src/LICENSE.md
    destination: share/doc/jailops/LICENSE.md
  - source: src/docs/design.md
    destination: share/doc/jailops/design.md

services:
  - {name: jailopsd, source: src/packaging/rc.d/jailopsd}
  - {name: jailops_priv, source: src/packaging/rc.d/jailops_priv}

dirs:
  - {path: /var/db/jailops, owner: jailops, group: jailops, mode: 0750}

users:
  - {name: jailops, home: /var/db/jailops, comment: JailOps daemon}

scripts:
  post-install: |
    # an upgrade (init has written priv.conf): only what the new version needs, not the first-install steps
    if [ -f /usr/local/etc/jailops/priv.conf ]; then
      echo "JailOps is upgraded. Restart it to run the new version: service jailops_priv restart && service jailopsd restart"
      exit 0
    fi
    echo "JailOps is installed. Next, as root, one command:"
    echo "  jailops-setup"
    echo "It sets the host up (jailops-priv init, IP forwarding, the anchor lines in /etc/pf.conf, the services),"
    echo "runs jailops doctor, offers to create the first administrator and prints the console address."
    echo "It asks before it changes pf; jailops-setup -n shows what it would do. See man jailops-setup."
