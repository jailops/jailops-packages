group: isms
repo: unidoc/isms
tag_prefix: v
tarball: https://github.com/${repo}/archive/refs/tags/${tag}.tar.gz
strip_components: 1
sha256: 6dac2a584fc62ebe12be8ce055b4760b077f7cad8033cf6048ca9f8835188e6f
token_env:
# scripts/sync-migrations.sh, cd web && npm ci && npm run build, copy web/dist into cmd/isms/web/dist (Node 24 + npm)
prebuild: isms-web
bump_note: The web UI build, the migrations and the install message (server.env, signing key) are not re-verified by the bump; read the isms release notes and the build log.
